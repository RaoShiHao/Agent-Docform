   * Based on the requirements in `requirement`, generate the corresponding `setting` dictionary. Field names and values must strictly comply with the tool definitions.

3. The output must be in JSON format and strictly follow the **funcall** structure, which includes `tool_name`, `function`, and `parameters`.

4. If a function includes a `doc` parameter, no additional value is required. Always use `current_doc` as the default value for `doc`.


### Output Format (Funcall Style)

```json
